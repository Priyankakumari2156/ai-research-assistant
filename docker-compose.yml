version: "3.9"

services:

  backend:
    build: .

    image: ai-research-assistant

    container_name: ai_backend

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

    depends_on:
      - qdrant

  streamlit:

    image: ai-research-assistant

    container_name: ai_streamlit

    command: >
      streamlit run streamlit_app/Home.py
      --server.address=0.0.0.0
      --server.port=8501

    ports:
      - "8501:8501"

    env_file:
      - .env

    depends_on:
      - backend

  qdrant:

    image: qdrant/qdrant

    container_name: qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:

  qdrant_data: