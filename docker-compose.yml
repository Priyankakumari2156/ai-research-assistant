services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: ai_backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - qdrant

    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: ai_streamlit

    restart: unless-stopped

    ports:
      - "8501:8501"

    env_file:
      - .env

    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant

    container_name: qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: